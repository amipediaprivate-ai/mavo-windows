[package]
name = "caevir"
version = "0.1.0"
description = "Caevir desktop digital asset manager"
authors = ["Amipedia"]
edition = "2021"

[lib]
name = "caevir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1.8"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
imagequant = "4.4.1"
notify = "8.2"
oxipng = { version = "10.1.1", default-features = false, features = ["parallel"] }
png = "0.18.1"
psd = "0.3.5"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
trash = "5"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }
